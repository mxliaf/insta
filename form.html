<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="reset.css">
</head>

<body>
    <div id="conteudo">
        <div id="navbar">

        </div>
        <div id="sidebar">
            <div id="formulario">
                <form action="#" autocomplete="off" method="post">
                    <div>
                        <label for="nome">
                            Nome:
                        </label>
                        <input type="text" id="nome">
                    </div>
                    <div>
                        <label for="email">
                            E-mail:
                        </label>
                        <input type="email" name="email" id="">
                    </div>
                    <div>
                        <label for="msg">Mensagem:</label>
                        <textarea id="msg" name="usuario-msg"></textarea>
                    </div>
                    <div id="form-item">
                        <label for="idade">Selecione sua idade: </label>
                        <input type="radio" name="idade" id="idade1">
                        Menor de 18
                        <input type="radio" name="idade" id="idade2"> Entre 18 e 25
                        <input type="radio" name="idade" id="idade3"> Entre 25 e 40
                        <input type="radio" name="idade" id="idade4"> Acima de 40
                    </div>
                    <div class="button">
                        <button type="submit">Enviar sua mensagem</button>
                    </div>
                    
        </div>
    </div>

</body>

</html>
